# CI — the Phase 0 green baseline for this repository.
#
# This is the promoted, repo-specific counterpart to the reusable template in
# `workflow-templates/ci.yml`. The template stays generic (it demonstrates a
# unit / coverage / multi-browser-e2e fan-out for consumers to copy); this file
# runs the gates *this* repo can actually satisfy, in the order CLAUDE.md
# prescribes: install → typecheck → lint → test → build.
#
# Deliberately not included: the template's Playwright e2e matrix. The specs in
# `playwright/` navigate to a running application at PLAYWRIGHT_BASE_URL
# (default http://localhost:5173) and this repository ships no such app, so
# those jobs cannot go green here. Wiring them up needs a demo app or a
# `webServer` block and is tracked separately — see SPEC.md. The `component`
# and `intercept` jobs below are the halves of Playwright that have no such
# problem: one bundles a component and drives it, so there is nothing to serve,
# and the other brings its own origin — `intercept/server.ts`, seven routes of
# Node started as a `webServer` — because what it measures is what happens
# between a browser and a server rather than inside an application.
#
# There are six jobs. `gates` runs the five gates plus the contract suites on
# every supported Node major; `mutation`, `containers`, `component`,
# `contracts` and `intercept` each run once, in parallel, for the reason stated
# above each of them — a mutation score is a property of the tests rather than
# the runtime, and the other four need a browser, a port or a service that
# `pnpm test` must never require. All six are required: nothing here treats any
# of them as advisory.
#
# ---------------------------------------------------------------------------
# Node support matrix
# ---------------------------------------------------------------------------
# `matrix.node-version` must stay in lockstep with `engines.node` in
# package.json. Both cover the two Node LTS lines — 22 (Jod) and 24 (Krypton) —
# plus 26, the Current line, so the next LTS promotion is not a surprise.
# `.npmrc` sets `engine-strict=true`, so a matrix leg outside that declared
# range fails at install rather than drifting silently out of support.
#
# The 22 floor is `^22.18.0` rather than `^22.13.0` because `eslint.config.js`
# imports a TypeScript module directly — `tdd/conventions/eslint-plugin/`, the
# repository's own lint rules — and Node loads that import itself. 22.18.0 is
# the release where type stripping stopped needing `--experimental-strip-types`.
# `setup-node` with `node-version: 22` resolves the latest 22.x, so this leg
# satisfies the floor; the declaration exists so a consumer pinning an older
# 22 is told at install time rather than by an unreadable resolver error.
#
# Node 26 was previously excluded because the supertest suite failed there:
# two concurrent requests through one `supertest.agent()` wrapping a
# non-listening `http.Server` died with ECONNRESET on 26.5.1 and passed on 22
# and 24. The cause was supertest's, not Node's — it binds the server itself on
# the first request that finds it unbound (`lib/test.js#serverAddress`) and
# closes it again when *that* request ends (`#end`), resetting siblings still
# in flight. `supertest/createTestApp.ts` now binds the server up front so
# supertest never takes ownership, and the race is gone on all three majors.
#
# ---------------------------------------------------------------------------
# Warnings are failures
# ---------------------------------------------------------------------------
#   - `--frozen-lockfile` fails the job if package.json and pnpm-lock.yaml have
#     drifted apart.
#   - `--strict-peer-dependencies` turns an unmet peer range from a log warning
#     into a non-zero exit.
#   - `strict-dep-builds=true` (.npmrc) turns pnpm's "ignored build scripts"
#     notice into ERR_PNPM_IGNORED_BUILDS, so a new dependency with a
#     postinstall has to be triaged into `pnpm.onlyBuiltDependencies` rather
#     than silently skipped.
#   - `pnpm lint` passes `--max-warnings 0`, so a rule set to "warn" fails the
#     job instead of scrolling past in the log.
#   - `NODE_OPTIONS: --throw-deprecation` promotes Node runtime deprecation
#     warnings to thrown errors, so a deprecated API — ours or a dependency's —
#     surfaces on the oldest and the newest supported runtime rather than at
#     the point where that API is finally removed. Every gate step sets it,
#     and `workflow-templates/gateSteps.test.ts` audits this file to keep that
#     true: a gate that loses its `env:` block fails `pnpm test` instead of
#     quietly stopping to enforce anything.
# `--pending-deprecation` is deliberately not set: it flags APIs that are not
# deprecated yet, which would fail the build on advisory notices.
#
# One warning class is *not* reachable from inside the job: the runner prints
# `##[warning] Node.js 20 is deprecated` about an action whose `action.yml`
# still declares `runs.using: node20`, before any step of ours executes. Every
# `uses:` below is therefore pinned to a major that declares `node24`, and
# `workflow-templates/actionPins.test.ts` audits those pins as text so a
# regression fails `pnpm test` instead of scrolling past in a runner log.
#
# `--throw-deprecation` is set per step rather than job-wide so that the
# `env:` block reads as a claim about that step — the audit above checks the
# gates, and pnpm's own install runs under its own runtime where the flag
# would police the package manager rather than this repository's build.
#
# The Build step was the last gate to get the flag, and it took two fixes.
#
# Under Storybook 9.1.20 it could not satisfy it: `extractStorybookMetadata`
# runs after the output is emitted and counts portable-stories files by
# shelling out through execa with `shell: true` plus an argument array, which
# is DEP0190 on Node 24+, so `storybook build` threw and exited 7 with
# storybook-static/ already complete. Storybook 10.5.5 calls
# `execCommandCountLines('git', ['grep', …])` with no shell at all, so there is
# nothing left to throw.
#
# Clearing DEP0190 exposed DEP0205 underneath it, on the Node 26 leg only:
# Storybook's `importModule` registers its TypeScript loader through
# `module.register()` before reading any config, and Node 26 deprecates that in
# favour of `module.registerHooks()`. It is third-party and unreachable from
# first-party code — writing `.storybook/main` as JavaScript would not avoid it
# — and it is still present on `storybook@next`. `patches/storybook@10.5.5.patch`
# forward-ports the upstream fix (storybookjs/storybook#35337): prefer
# `registerHooks` with a synchronous loader where it exists, fall back to
# `register` on runtimes without it. Dropping Node 26 from the matrix would
# have been the other way to make this green, and would have weakened the gate
# rather than satisfied it — `engines.node` declares ^26.0.0 supported.
# `workflow-templates/patchedDeps.test.ts` audits that patch pin so it cannot
# go missing quietly; delete the patch when the upstream fix ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref so stale runs don't hold runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Report every unsupported runtime in one run instead of stopping at the
      # first — knowing a break is 22-only vs. both majors is the whole point.
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input — the action reads the pinned `packageManager`
      # field from package.json, so CI and local installs cannot disagree.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Unit tests
        run: pnpm test
        env:
          NODE_OPTIONS: --throw-deprecation

      # The contract suites. Their own step rather than part of `pnpm test`
      # because they are two commands in a fixed order — the consumer suites
      # write `pacts/`, the provider suite verifies it — and because they spawn
      # the pact FFI, which wants a Node environment and a forked pool that the
      # jsdom unit run must not share. Nothing here needs a broker; the wirings
      # that do are the `contracts` job below.
      - name: Contract tests
        run: pnpm test:pact
        env:
          NODE_OPTIONS: --throw-deprecation

      # The test-suite shape gate. Runs after the unit tests because it asks
      # both runners to *collect* (`vitest list`, `playwright test --list`) —
      # if collection is broken, the tests above have already said so more
      # clearly. It needs no browser: Playwright lists specs without launching
      # one. See shape/README.md.
      - name: Test shape
        run: pnpm shape:check
        env:
          NODE_OPTIONS: --throw-deprecation

      # The snapshot policy gate. Like the shape gate it asks Vitest to
      # *collect* rather than run — one rule, obsolescence, needs the list of
      # test names and cannot be decided from the filesystem. Only the test
      # files that own a `.snap` are listed, so this is a second or two rather
      # than a second collection of the whole suite. Everything the policy can
      # decide statically is already in `pnpm test`. See snapshot/README.md.
      - name: Snapshot policy
        run: pnpm snapshot:check
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload Storybook build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static-node${{ matrix.node-version }}-${{ github.run_number }}
          path: storybook-static/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Mutation score
  # ---------------------------------------------------------------------------
  # Its own job, on one Node major, and both halves of that are deliberate.
  #
  # Its own job because it is minutes rather than seconds: Stryker re-runs the
  # covering tests once per mutant, and `mutation/scope.ts` currently declares
  # four modules worth several hundred mutants between them. Sequenced behind
  # the gates it would add that to every pull request's critical path; run in
  # parallel it costs a runner and no wall clock, because `gates` is slower.
  #
  # One Node major because a mutation score is a property of the tests, not of
  # the runtime. Three legs would re-derive the same percentage three times for
  # three times the minutes, and a leg that disagreed would be reporting a Node
  # bug the matrix above is already the right place to find. 24 is the current
  # LTS and the middle of the supported range.
  #
  # `needs:` is deliberately absent. A mutation score computed while a test is
  # failing is meaningless, but so is waiting fifteen minutes to be told that —
  # `pnpm mutation:check` runs the same suites and fails on its own if they are
  # broken, and both jobs must be green for the pull request to merge either
  # way.
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Mutation score
        run: pnpm mutation:check
        env:
          NODE_OPTIONS: --throw-deprecation

      # The JSON report, whether or not the gate passed — especially when it
      # did not. The log prints every survivor, but the report is what a
      # mutation-testing-elements viewer renders, and it is the artefact
      # somebody arguing about a floor actually wants.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.run_number }}
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Container suites
  # ---------------------------------------------------------------------------
  # Its own job, on one Node major, for the same two reasons the mutation gate
  # has one.
  #
  # Its own job because it needs a container runtime and `pnpm test` must never
  # require one — a contributor with no Docker still runs every other gate — and
  # because starting a Postgres, a Redis and a Kafka broker and driving a
  # residue matrix through them is minutes rather than seconds. Sequenced behind
  # `gates` it would sit on the critical path of every pull request; in parallel
  # it costs a runner and no wall clock.
  #
  # One Node major because what these suites measure is the behaviour of a
  # container runtime and three servers, none of which is written in JavaScript.
  # Three legs would start three Kafka brokers to re-derive the same matrix.
  #
  # `ubuntu-latest` ships a running Docker daemon, which is the whole
  # requirement: `containers/setup.ts` asks it for a version before any suite
  # tries to start something, so a runner image that ever stops providing one
  # fails with a sentence rather than a start-up timeout.
  #
  # Reuse is deliberately off here and `daemon.ts` decides that from `CI`: a
  # fresh runner's daemon has nothing to adopt, so every reuse lookup would miss
  # and the only thing left would be the liability — a reused container carries
  # no session label and Ryuk never reaps it. See containers/README.md.
  containers:
    name: Container suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      # Pulled explicitly rather than on demand so that a registry problem is
      # reported as one, before a wait strategy has a chance to report it as a
      # container that would not start. The tags are the ones in
      # `containers/images.ts`; `containers/images.test.ts` fails if they drift
      # apart.
      - name: Pull images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7.4-alpine
          docker pull confluentinc/cp-kafka:8.0.0

      - name: Container suites
        run: pnpm test:containers
        env:
          NODE_OPTIONS: --throw-deprecation

  # ---------------------------------------------------------------------------
  # Component tests
  # ---------------------------------------------------------------------------
  # Its own job, on one Node major, for reasons that rhyme with the three jobs
  # above without being the same ones.
  #
  # Its own job because it needs a browser. `pnpm test:ct` bundles each
  # component with Vite and drives it in Chromium, so the job downloads a
  # browser and its system libraries — a couple of minutes that every leg of
  # the `gates` matrix would otherwise pay three times over for a suite whose
  # subject is a rendering engine rather than a Node runtime.
  #
  # One Node major because what these specs measure is Chromium's layout,
  # top layer and focus behaviour. Node runs the test file and the bundler;
  # nothing the specs assert is decided by it.
  #
  # This is the one job in this file that runs a Playwright suite, and it is
  # worth being explicit about why the *other* Playwright suite still does not:
  # the specs in `playwright/` navigate to an application at
  # PLAYWRIGHT_BASE_URL and this repository ships none. A component test has no
  # such dependency — the component is the system under test and the bundle is
  # the whole deployment — which is exactly what makes it the half of Playwright
  # this repository can hold itself to. See ct/README.md.
  #
  # `--with-deps` installs the shared libraries Chromium needs on the runner
  # image. `--only-shell` is deliberately not used: `ct/ConfirmButton.spec.tsx`
  # asserts on the top layer and the backdrop, and the headless shell is a
  # different build from the browser people use.
  component:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm test:ct
        env:
          NODE_OPTIONS: --throw-deprecation

      # The HTML report, whether or not the suite passed. A failing component
      # spec is usually a question about what the browser actually rendered,
      # and the report carries the trace and the screenshot that answer it.
      - name: Upload component test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-report-${{ github.run_number }}
          path: playwright-report/ct/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Contract pipeline
  # ---------------------------------------------------------------------------
  # Its own job, on one Node major, for the reasons the `containers` job has
  # one: it needs a service this repository must never require of `pnpm test`,
  # and what it measures — which contract-testing wiring notices which change —
  # is a property of a Pact Broker and a Rust verifier, neither of which is
  # written in JavaScript. Three legs would start three brokers to re-derive
  # the same matrix.
  #
  # The broker is started with `docker run` rather than declared as a service
  # container, and that is deliberate. `pactfoundation/pact-broker` runs its
  # database migrations at boot and exits if the database is not there;
  # GitHub starts service containers concurrently, so a broker declared
  # alongside its Postgres races it and loses often enough to matter. Started
  # as a step, it runs after Postgres has passed its health check, and the wait
  # below turns a broker that did not come up into one line naming the
  # heartbeat rather than into 44 connection errors.
  #
  # The image is pinned in `pact/broker/image.ts` and `image.test.ts` audits
  # this file against it: every figure in `pact/README.md` is an answer some
  # version of the broker gave.
  contracts:
    name: Contract pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `POSTGRES_HOST_AUTH_METHOD: trust` rather than a password, and not for
    # convenience: a literal password here was flagged by GitGuardian as a
    # "Generic Password" on the pull request that added this job. It was a
    # throwaway for a container that lives for one job on a network only that
    # job can reach — but a scanner cannot tell that from the real thing, and a
    # repository whose secret scanning is routinely red is one where the next
    # finding is skimmed. `trust` is what the postgres image documents for
    # exactly this case, and it leaves nothing credential-shaped in the file.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pact_broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      # Pulled explicitly so a registry problem is reported as one, before the
      # readiness wait has a chance to report it as a broker that would not
      # start. Same reasoning as the `containers` job.
      - name: Pull the Pact Broker image
        run: docker pull pactfoundation/pact-broker:2.143.0-pactbroker2.121.0

      # `--network host` so the broker can reach the Postgres service on
      # 127.0.0.1:5432 and the runner can reach the broker on 127.0.0.1:9292,
      # without a bridge network the service container is not on.
      - name: Start the Pact Broker
        run: |
          docker run -d --name pact-broker --network host \
            -e PACT_BROKER_DATABASE_URL=postgres://postgres@127.0.0.1:5432/pact_broker \
            -e PACT_BROKER_PORT=9292 \
            -e PACT_BROKER_LOG_LEVEL=WARN \
            pactfoundation/pact-broker:2.143.0-pactbroker2.121.0

      - name: Wait for the Pact Broker
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9292/diagnostic/status/heartbeat > /dev/null; then
              echo "broker answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "the broker did not answer its heartbeat within 60s"
          docker logs pact-broker
          exit 1

      - name: Contract pipeline matrix
        run: pnpm test:pact:broker
        env:
          NODE_OPTIONS: --throw-deprecation
          PACT_BROKER_BASE_URL: http://127.0.0.1:9292

      # The broker's own log, whether or not the matrix passed — especially
      # when it did not. A cell that reports the wrong stage is usually
      # explained by a request the broker rejected, and that request is here.
      - name: Pact Broker logs
        if: always()
        run: docker logs pact-broker

  # ---------------------------------------------------------------------------
  # Network-interception matrix
  # ---------------------------------------------------------------------------
  # Its own job, on one Node major, for the reason the `component` job has one
  # and for a second that is new to this file.
  #
  # The first is a browser: `pnpm test:intercept` drives Chromium, so the job
  # downloads a browser and its system libraries. The `gates` matrix would pay
  # that three times over for a suite whose subject is Playwright's routing.
  #
  # The second is a *port*. These specs measure what happens between a browser
  # and an origin, so there has to be an origin: the config starts
  # `intercept/server.ts` on 3111 as a `webServer` and waits for it. `pnpm test`
  # must never require a free port any more than it may require Docker, which
  # is why the suite is not part of it — and why `vitest.config.ts` excludes
  # `intercept/**/*.spec.ts` while keeping the rest of that directory, which is
  # ordinary computation, in the unit run.
  #
  # One Node major because what the specs measure is decided by Chromium and by
  # Playwright's HAR matcher. Node runs the fixture origin and the test file;
  # nothing asserted here is a property of its version.
  #
  # `--only-shell` is deliberately not used, matching the `component` job: the
  # offline specs read a computed style out of a rendered document, and the
  # headless shell is a different build from the browser people use.
  intercept:
    name: Network interception
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Network interception matrix
        run: pnpm test:intercept
        env:
          NODE_OPTIONS: --throw-deprecation

      # The HTML report, whether or not the suite passed. A failing cell is a
      # question about what the browser did with one request, and the trace is
      # what answers it.
      - name: Upload interception test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intercept-report-${{ github.run_number }}
          path: playwright-report/intercept/
          retention-days: 7
          if-no-files-found: ignore
